<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Condensed:wght@700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C8102E}a:hover{color:#9E0B22}
</style>
</helmet>
<div style="width: 390px; min-height: 844px; box-sizing: border-box; padding: 24px; background: #F7F7F8; color: #1B1B1F; font-family: Roboto, system-ui, sans-serif; font-size: 14px; line-height: 20px; display: flex; flex-direction: column; justify-content: center; gap: 12px">
  <div style="font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 1px; text-transform: uppercase; color: #C8102E">Workout Program</div>
  <h1 style="margin: 0; font-family: 'Roboto Condensed', Roboto, sans-serif; font-weight: 800; font-size: 34px; line-height: 40px; letter-spacing: 0.5px; text-transform: uppercase">Sign in</h1>
  <div style="color: #4A4A50">Use the Google account your coach has for you.</div>

  <sc-if value="{{refused}}" hint-placeholder-val="{{ false }}">
    <div role="alert" style="color: #C8102E">Your coach hasn't added alex@example.com yet.</div>
  </sc-if>

  <a href="Main.dc.html" style="align-self: flex-start; margin-top: 4px; height: 48px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 12px; padding: 0 20px 0 14px; background: #FFFFFF; border: 1px solid #74747A; border-radius: 24px; color: #1B1B1F; text-decoration: none; font-weight: 500; letter-spacing: 0.1px">
    <span aria-hidden="true" style="width: 20px; height: 20px; box-sizing: border-box; border: 1px dashed #74747A; border-radius: 10px"></span>Sign in with Google
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"refused":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { refused: this.props.refused ?? false };
  }
}
</script>
</body>
</html>
